<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sónar de Pesca Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet para el Mapa Satelital -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .leaflet-container { background: #030712 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <div class="max-w-md mx-auto p-4 pb-12 space-y-4">
        <header class="flex justify-between items-center bg-slate-900/90 border border-slate-800 p-3 rounded-2xl backdrop-blur">
            <div>
                <h1 class="text-sm font-black tracking-wider text-cyan-400 uppercase">SÓNAR TÁCTICO</h1>
                <p id="txt-geo-nombre" class="text-[11px] text-slate-400 font-mono">Cargando...</p>
            </div>
            <button onclick="abrirCamara()" class="bg-cyan-500 text-slate-950 px-3 py-1.5 rounded-lg font-black text-[10px]">REGISTRAR</button>
        </header>

        <nav class="flex gap-2">
            <button id="b-mapa" onclick="alternarVentana(false)" class="flex-1 bg-cyan-500 text-slate-950 text-xs font-bold px-3 py-2.5 rounded-xl transition-all">🗺️ MAPA</button>
            <button id="b-pokedex" onclick="alternarVentana(true)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2.5 rounded-xl transition-all">📸 CAPTURAS (<span id="pokedex-contador">0</span>)</button>
        </nav>

        <!-- Contenedor Mapa -->
        <div id="v-mapa" class="space-y-4">
            <div id="mapa-satelital" class="h-[210px] w-full rounded-xl relative overflow-hidden border border-slate-800 shadow-lg"></div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="seleccionarTramoPreset('ebro')" class="bg-slate-900 border border-slate-800 text-[10px] p-2 rounded-lg font-mono">Ebro</button>
                <button onclick="seleccionarTramoPreset('caspe')" class="bg-slate-900 border border-slate-800 text-[10px] p-2 rounded-lg font-mono">Caspe</button>
                <button onclick="seleccionarTramoPreset('mequinenza')" class="bg-slate-900 border border-slate-800 text-[10px] p-2 rounded-lg font-mono">Mequinenza</button>
            </div>
        </div>

        <!-- Contenedor Pokedex -->
        <div id="v-pokedex" class="hidden space-y-4">
            <div id="grid-pokedex" class="grid grid-cols-2 gap-3"></div>
        </div>
    </div>

    <!-- Modal Cámara -->
    <div id="modal-camara" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <video id="video-camara" autoplay playsinline class="w-full h-full object-cover"></video>
        <canvas id="canvas-foto" class="hidden w-full h-full object-cover"></canvas>
        <div id="controles-disparo" class="absolute bottom-10 w-full text-center">
            <button onclick="capturarFoto()" class="w-16 h-16 bg-white rounded-full border-4 border-slate-600"></button>
        </div>
        <div id="formulario-captura" class="hidden absolute bottom-0 w-full p-6 bg-slate-900 rounded-t-3xl">
            <input id="ins-especie" type="text" placeholder="Especie" class="w-full bg-slate-800 p-3 rounded-lg mb-2 text-sm text-white">
            <input id="ins-lugar" type="text" readonly class="w-full bg-slate-950 p-3 rounded-lg mb-4 text-slate-500 text-sm">
            <button onclick="guardarCaptura()" class="w-full bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg">GUARDAR CAPTURA</button>
        </div>
    </div>

    <script>
        let map, markersLayer = L.layerGroup();
        let streamCamara, fotoBase64, ubicacionNombre = "Ubicación";
        const PRESETS = {
            ebro: { lat: 41.6575, lng: -0.8762, nombre: "Río Ebro - Zaragoza" },
            caspe: { lat: 41.2333, lng: -0.0333, nombre: "Embalse de Caspe" },
            mequinenza: { lat: 41.3621, lng: 0.1742, nombre: "Mequinenza" }
        };

        function inicializarMapa() {
            map = L.map('mapa-satelital', { zoomControl: false }).setView([41.6575, -0.8762], 12);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            markersLayer.addTo(map);
        }

        function seleccionarTramoPreset(key) {
            const p = PRESETS[key];
            ubicacionNombre = p.nombre;
            document.getElementById('txt-geo-nombre').innerText = p.nombre;
            map.setView([p.lat, p.lng], 13);
            markersLayer.clearLayers();
            L.marker([p.lat, p.lng]).addTo(markersLayer);
        }

        function alternarVentana(esPokedex) {
            const vMapa = document.getElementById('v-mapa');
            const vPokedex = document.getElementById('v-pokedex');
            const bMapa = document.getElementById('b-mapa');
            const bPokedex = document.getElementById('b-pokedex');
            
            if (esPokedex) {
                vMapa.classList.add('hidden'); vPokedex.classList.remove('hidden');
                bMapa.className = "flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2.5 rounded-xl transition-all";
                bPokedex.className = "flex-1 bg-cyan-500 text-slate-950 text-xs font-bold px-3 py-2.5 rounded-xl transition-all";
                renderizarPokedex();
            } else {
                vPokedex.classList.add('hidden'); vMapa.classList.remove('hidden');
                bPokedex.className = "flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2.5 rounded-xl transition-all";
                bMapa.className = "flex-1 bg-cyan-500 text-slate-950 text-xs font-bold px-3 py-2.5 rounded-xl transition-all";
            }
        }

        async function abrirCamara() {
            const modal = document.getElementById('modal-camara');
            modal.classList.remove('hidden');
            document.getElementById('ins-lugar').value = ubicacionNombre;
            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video-camara').srcObject = streamCamara;
            } catch(e) { alert("Cámara no disponible."); }
        }

        function capturarFoto() {
            const video = document.getElementById('video-camara'), canvas = document.getElementById('canvas-foto');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
            video.classList.add('hidden'); canvas.classList.remove('hidden');
            document.getElementById('controles-disparo').classList.add('hidden');
            document.getElementById('formulario-captura').classList.remove('hidden');
            if(streamCamara) streamCamara.getTracks().forEach(t => t.stop());
        }

        function guardarCaptura() {
            let hist = JSON.parse(localStorage.getItem('fishing_pokedex') || '[]');
            hist.push({ id: Date.now(), especie: document.getElementById('ins-especie').value, lugar: ubicacionNombre, foto: fotoBase64 });
            localStorage.setItem('fishing_pokedex', JSON.stringify(hist));
            document.getElementById('modal-camara').classList.add('hidden');
            renderizarPokedex();
        }

        function renderizarPokedex() {
            const grid = document.getElementById('grid-pokedex');
            const hist = JSON.parse(localStorage.getItem('fishing_pokedex') || '[]');
            document.getElementById('pokedex-contador').innerText = hist.length;
            grid.innerHTML = hist.map(c => `
                <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl">
                    <img src="${c.foto}" class="w-full aspect-square object-cover rounded-lg mb-2">
                    <h4 class="text-[11px] font-black text-white">${c.especie}</h4>
                    <p class="text-[9px] text-slate-500 font-mono">📍 ${c.lugar}</p>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            inicializarMapa();
            seleccionarTramoPreset('ebro');
            renderizarPokedex();
        });
    </script>
</body>
</html>
