<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sónar de Pesca Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Estructura Principal -->
    <div class="max-w-md mx-auto p-4 pb-12 space-y-4">
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-2xl">
            <div>
                <h1 class="text-sm font-black text-cyan-400 uppercase">SÓNAR TÁCTICO</h1>
                <p id="txt-geo-nombre" class="text-[10px] text-slate-500 font-mono">Cargando...</p>
            </div>
            <button onclick="abrirCamara()" class="bg-cyan-500 text-slate-950 px-3 py-1.5 rounded-lg font-black text-[10px]">REGISTRAR</button>
        </header>

        <nav class="flex gap-2">
            <button id="b-mapa" onclick="alternarVentana(false)" class="flex-1 bg-cyan-500 text-slate-950 text-xs font-bold px-3 py-2.5 rounded-xl">MAPA</button>
            <button id="b-pokedex" onclick="alternarVentana(true)" class="flex-1 bg-slate-800 text-slate-300 text-xs font-bold px-3 py-2.5 rounded-xl">CAPTURAS (<span id="pokedex-contador">0</span>)</button>
        </nav>

        <div id="v-mapa" class="space-y-4">
            <div id="mapa-satelital" class="h-[210px] w-full rounded-xl border border-slate-800 overflow-hidden"></div>
            <div id="consejos-zona" class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-slate-400 italic"></div>
        </div>

        <div id="v-pokedex" class="hidden space-y-4">
            <div id="grid-pokedex" class="grid grid-cols-2 gap-3"></div>
        </div>
    </div>

    <!-- Modal Cámara -->
    <div id="modal-camara" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <video id="video-camara" autoplay playsinline class="w-full h-full object-cover"></video>
        <canvas id="canvas-foto" class="hidden w-full h-full object-cover"></canvas>
        <div id="controles-disparo" class="absolute bottom-10 w-full text-center">
            <button onclick="capturarFoto()" class="w-16 h-16 bg-white rounded-full"></button>
        </div>
        <div id="formulario-captura" class="hidden absolute bottom-0 w-full p-6 bg-slate-900 rounded-t-3xl">
            <select id="ins-especie" class="w-full bg-slate-800 p-3 rounded-lg mb-2 text-sm text-white"></select>
            <input id="ins-lugar" type="text" readonly class="w-full bg-slate-950 p-3 rounded-lg mb-4 text-slate-500 text-sm">
            <button onclick="guardarCaptura()" class="w-full bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg">GUARDAR</button>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS ESTRUCTURADA ---
        const DATA_PESCA = {
            "siluro": { nombre: "Siluro", consejo: "Busca en zonas profundas y con estructuras sumergidas. Usa señuelos grandes." },
            "lucioperca": { nombre: "Lucioperca", consejo: "Activa al amanecer y atardecer. Prefiere fondos rocosos." },
            "blackbass": { nombre: "Black Bass", consejo: "Zonas de vegetación y recodos tranquilos. Imprescindible precisión." }
        };

        const CONTORNOS_SVG = {
            "siluro": `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12c0 5 8 10 20 2-2-8-10-8-20-2z"/></svg>`,
            "lucioperca": `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10l16-4v4l-16 4z"/></svg>`,
            "blackbass": `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6 2 2 6 2 12s4 10 10 10 10-4 10-10S18 2 12 2z"/></svg>`
        };

        const PRESETS = {
            ebro: { lat: 41.6575, lng: -0.8762, nombre: "Río Ebro - Zaragoza", especie: "siluro" },
            caspe: { lat: 41.2333, lng: -0.0333, nombre: "Embalse de Caspe", especie: "lucioperca" }
        };

        let map, markersLayer = L.layerGroup(), ubicacionNombre = "Ebro", streamCamara, fotoBase64;

        // --- LÓGICA MAPA ---
        function inicializarMapa() {
            map = L.map('mapa-satelital', { zoomControl: false }).setView([41.6575, -0.8762], 12);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            markersLayer.addTo(map);
        }

        function seleccionarTramoPreset(key) {
            const p = PRESETS[key];
            ubicacionNombre = p.nombre;
            document.getElementById('txt-geo-nombre').innerText = p.nombre;
            document.getElementById('consejos-zona').innerText = "💡 " + DATA_PESCA[p.especie].consejo;
            map.setView([p.lat, p.lng], 13);
            markersLayer.clearLayers();
            L.marker([p.lat, p.lng]).addTo(markersLayer);
        }

        // --- LÓGICA POKEDEX Y CÁMARA ---
        function alternarVentana(esPokedex) {
            document.getElementById('v-mapa').classList.toggle('hidden', esPokedex);
            document.getElementById('v-pokedex').classList.toggle('hidden', !esPokedex);
            if(esPokedex) renderizarPokedex();
        }

        async function abrirCamara() {
            document.getElementById('modal-camara').classList.remove('hidden');
            document.getElementById('ins-lugar').value = ubicacionNombre;
            const select = document.getElementById('ins-especie');
            select.innerHTML = Object.entries(DATA_PESCA).map(([k,v]) => `<option value="${k}">${v.nombre}</option>`).join('');
            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video-camara').srcObject = streamCamara;
            } catch(e) { alert("Cámara no disponible"); }
        }

        function capturarFoto() {
            const video = document.getElementById('video-camara'), canvas = document.getElementById('canvas-foto');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
            video.classList.add('hidden'); canvas.classList.remove('hidden');
            document.getElementById('controles-disparo').classList.add('hidden');
            document.getElementById('formulario-captura').classList.remove('hidden');
        }

        function guardarCaptura() {
            let hist = JSON.parse(localStorage.getItem('fishing_pokedex') || '[]');
            hist.push({ id: Date.now(), especie: document.getElementById('ins-especie').value, lugar: ubicacionNombre, foto: fotoBase64 });
            localStorage.setItem('fishing_pokedex', JSON.stringify(hist));
            document.getElementById('modal-camara').classList.add('hidden');
            renderizarPokedex();
        }

        function renderizarPokedex() {
            const grid = document.getElementById('grid-pokedex');
            const hist = JSON.parse(localStorage.getItem('fishing_pokedex') || '[]');
            document.getElementById('pokedex-contador').innerText = hist.length;
            grid.innerHTML = hist.map(c => `
                <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl">
                    <img src="${c.foto}" class="w-full aspect-square object-cover rounded-lg mb-2">
                    <div class="flex justify-between items-center">
                        <h4 class="text-[11px] font-black text-white">${DATA_PESCA[c.especie]?.nombre}</h4>
                        <div class="w-6 h-6 text-slate-700">${CONTORNOS_SVG[c.especie] || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            inicializarMapa();
            seleccionarTramoPreset('ebro');
            renderizarPokedex();
        };
    </script>
</body>
</html>
